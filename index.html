  .vig-sub{display:block;font-size:11px;color:var(--muted);margin-top:6px}

</style>

  const rowIsActive=l=>!!(l.of||l.anoOF||l.item||l.qtd||l.valorNF||l.dataOS||l.nf||l.dataNF||l.empenho||l.pago||(l.alocManual&&l.alocManual.some(a=>a.empenho||a.valor)));
  const lancBase=c.lancamentos.map((l,idx)=>{
    const qtdNum=parseQty(l.qtd);
    const valorCalculadoCents=Math.round(qtdNum*unitOf(l.item));
    const valorManualCents=parseMoneyToCents(l.valorNF);
    const valorCents=valorManualCents>0?valorManualCents:valorCalculadoCents;
    const hasNF=rowHasNF(l),hasOF=!!String(l.of||'').trim();
    return {...l,idx,qtdNum,valorCalculadoCents,valorManualCents,valorCents,ativo:rowIsActive(l),hasNF,hasOF,
      alocacaoEmpenho:'',alocacoes:[],valorAlocadoCents:0,valorNaoAlocadoCents:hasNF?valorCents:0,
      alocacaoStatus:hasNF?'pendente':'aguardando_nf',alocacaoMsg:hasNF?'Aguardando alocação':'OF registrada; aguardando NF'};
  });

  const itens=c.itens.map(it=>{
    const qtdOriginal=parseQty(it.qtd),unit=parseMoneyToCents(it.unit);
    const aditItem=aditivos.filter(a=>String(a.item)===String(it.item)&&it.item!=='');
    const qtdAditivo=aditItem.reduce((s,a)=>s+a.qtdAcrescimoNum-a.qtdSupressaoNum,0);
    const qtdAtual=qtdOriginal+qtdAditivo;
    const consNF=lancBase.filter(l=>l.hasNF&&String(l.item)===String(it.item)&&it.item!=='').reduce((s,l)=>s+l.qtdNum,0);
    const consOF=lancBase.filter(l=>!l.hasNF&&l.hasOF&&String(l.item)===String(it.item)&&it.item!=='').reduce((s,l)=>s+l.qtdNum,0);
    const saldoQtd=qtdAtual-consNF;
    return{item:it.item,desc:it.desc,qtd:qtdOriginal,unit,qtdAditivo,qtdAtual,cons:consNF,consNF,consOF,saldoQtd,totalOriginalCents:Math.round(qtdOriginal*unit),totalCents:Math.round(qtdAtual*unit),saldoCents:Math.round(saldoQtd*unit)};
  });
  const totalOriginal=itens.reduce((s,i)=>s+i.totalOriginalCents,0);
  const totalContratado=totalOriginal+totalAcrescimos-totalSupressoes;
  const totalNF=lancBase.filter(l=>l.hasNF).reduce((s,l)=>s+l.valorCents,0);
  const totalOF=lancBase.filter(l=>!l.hasNF&&l.hasOF).reduce((s,l)=>s+l.valorCents,0);
  const saldoContratado=totalContratado-totalNF;

  // Empenho pool = empenhos do contrato + empenhos vinculados a aditivos
  const empenhoSrc=[
    ...c.empenhos.map((e,i)=>({num:e.num,valor:e.valor,origem:'contrato',ref:i})),
    ...c.aditivos.map((a,i)=>({num:a.empenhoNum,valor:a.empenhoValor,origem:'aditivo',ref:i})).filter(e=>String(e.num||'').trim())
  ];
  const empenhos=empenhoSrc.map((e,idx)=>{const cap=parseMoneyToCents(e.valor);return{idx,num:e.num,cap,usado:0,saldo:cap,origem:e.origem,ref:e.ref};});
  const findEmp=num=>empenhos.find(x=>x.num===num&&x.num!=='');
  const nfParaAlocar=lancBase.filter(l=>l.hasNF);

  if(c.autoAlocacao!==false){
    let ptr=0;
    nfParaAlocar.forEach(l=>{
      if(!l.item&&l.valorManualCents<=0){l.alocacaoStatus='ignorado';l.alocacaoMsg='NF sem item ou valor';l.valorNaoAlocadoCents=0;return;}
      if(l.valorCents<=0){l.alocacaoStatus='ignorado';l.alocacaoMsg='NF sem valor';l.valorNaoAlocadoCents=0;return;}
      let restante=l.valorCents;l.alocacoes=[];
      while(restante>0&&ptr<empenhos.length){
        const e=empenhos[ptr];
        if(!e.num||e.saldo<=0){ptr++;continue;}
        const usar=Math.min(restante,e.saldo);
        if(usar>0){e.usado+=usar;e.saldo-=usar;l.alocacoes.push({empenho:e.num,valorCents:usar});restante-=usar;}
        if(e.saldo<=0)ptr++;
      }
      l.valorAlocadoCents=l.valorCents-restante;l.valorNaoAlocadoCents=restante;
      l.alocacaoEmpenho=l.alocacoes.map(a=>a.empenho).join(' / ');
      if(restante===0){l.alocacaoStatus='ok';l.alocacaoMsg=l.alocacoes.length>1?'NF rateada automaticamente entre empenhos':'NF alocada automaticamente';}
      else if(l.valorAlocadoCents>0){l.alocacaoStatus='parcial';l.alocacaoMsg='NF parcialmente alocada; saldo de empenho insuficiente';}
      else{l.alocacaoStatus='sem_saldo';l.alocacaoMsg='Sem saldo de empenho disponível para esta NF';}
    });
  }else{
    nfParaAlocar.forEach(l=>{
      const unit=unitOf(l.item);
      if(l.valorCents<=0){l.alocacaoStatus='pendente';l.alocacaoMsg='NF sem valor';l.valorNaoAlocadoCents=0;l.alocCalc=[];return;}
      const rows=Array.isArray(l.alocManual)?l.alocManual:[];
      const calc=rows.map(a=>({empenho:a.empenho,hasEmp:!!String(a.empenho||'').trim(),q:parseQty(a.qtd),qtdRaw:a.qtd}));
      if(!calc.some(x=>x.hasEmp)&&l.empenho)calc.push({empenho:l.empenho,hasEmp:true,q:0,qtdRaw:''});
      let qFix=0;calc.forEach(x=>{if(x.hasEmp&&x.q>0)qFix+=x.q;});
      const blanks=calc.filter(x=>x.hasEmp&&x.q<=0);
      calc.forEach(x=>{
        if(!x.hasEmp){x.q=0;x.v=0;return;}
        if(x.q<=0)x.q=(blanks.length===1)?Math.max(0,l.qtdNum-qFix):0;
        x.v=Math.round(x.q*unit);
        const e=findEmp(x.empenho);if(e){e.usado+=x.v;e.saldo-=x.v;}
      });
      l.alocCalc=calc;
      l.alocacoes=calc.filter(x=>x.hasEmp).map(x=>({empenho:x.empenho,qtd:x.q,valorCents:x.v}));
      const qAloc=l.alocacoes.reduce((s,x)=>s+x.qtd,0);
      const vAloc=l.alocacoes.reduce((s,x)=>s+x.valorCents,0);
      l.qtdAlocada=qAloc;l.valorAlocadoCents=vAloc;
      l.valorNaoAlocadoCents=Math.max(0,l.valorCents-vAloc);l.qtdNaoAlocada=Math.max(0,l.qtdNum-qAloc);
      l.alocacaoEmpenho=l.alocacoes.map(a=>a.empenho).join(' / ');
      if(!l.alocacoes.length){l.alocacaoStatus='pendente';l.alocacaoMsg='NF sem empenho manual';}
      else if(blanks.length>1){l.alocacaoStatus='parcial';l.alocacaoMsg='Mais de um empenho sem quantidade: informe a quantidade de cada rateio';}
      else if(qAloc===l.qtdNum){l.alocacaoStatus='ok';l.alocacaoMsg=l.alocacoes.length>1?'NF rateada manualmente por quantidade':'Alocado manualmente';}
      else if(qAloc<l.qtdNum){l.alocacaoStatus='parcial';l.alocacaoMsg='Quantidade alocada ('+fmtQty(qAloc)+') menor que a da NF ('+fmtQty(l.qtdNum)+')';}
      else{l.alocacaoStatus='negativo';l.alocacaoMsg='Quantidade alocada ('+fmtQty(qAloc)+') maior que a da NF ('+fmtQty(l.qtdNum)+')';}
    });
  }
  // saldo dos empenhos de aditivo, de volta para os aditivos
  aditivos.forEach(a=>{if(String(a.empenhoNum||'').trim()){const e=empenhos.find(x=>x.origem==='aditivo'&&x.ref===a.idx);if(e){a.empCap=e.cap;a.empUsado=e.usado;a.empSaldo=e.saldo;}}});

  const totalEmpenhado=empenhos.reduce((s,e)=>s+e.cap,0);
  const saldoEmpenho=empenhos.reduce((s,e)=>s+e.saldo,0);
  const pendente=lancBase.filter(l=>l.hasNF&&!l.pago).reduce((s,l)=>s+l.valorCents,0);
  const valorNaoAlocado=lancBase.filter(l=>l.hasNF).reduce((s,l)=>s+(l.valorNaoAlocadoCents||0),0);
  const pct=totalContratado>0?totalNF/totalContratado:0;

  const al=[];
  const dF=daysUntil(vigFimAtual);
  if(!c.contrato)al.push({t:'warn',m:'Contrato sem número informado.'});
  if(!c.fornecedor)al.push({t:'warn',m:'Fornecedor não informado.'});
  if(!vigFimAtual)al.push({t:'warn',m:'Fim da vigência não informado.'});
  if(c.processo&&onlyDigits(c.processo).length!==15)al.push({t:'warn',m:'Número do processo fora do padrão SEI de 15 dígitos.'});
  if(c.cnpj&&!validateCNPJ(c.cnpj))al.push({t:'warn',m:'CNPJ informado não passou na validação dos dígitos verificadores.'});
  if(dF!==null){if(dF<0)al.push({t:'err',m:`Vigência vigente vencida em ${fmtDate(vigFimAtual)}.`});else if(dF<=60)al.push({t:'warn',m:`Vigência vigente vence em ${dF} dia(s) (${fmtDate(vigFimAtual)}).`});}
  const empNums=empenhoSrc.map(e=>e.num).filter(Boolean);if(new Set(empNums).size!==empNums.length)al.push({t:'warn',m:'Há empenhos duplicados (contrato/aditivo).'});
  const itemNums=c.itens.map(i=>String(i.item)).filter(Boolean);if(new Set(itemNums).size!==itemNums.length)al.push({t:'warn',m:'Há itens duplicados.'});
  if(empenhos.some(e=>e.saldo<0))al.push({t:'err',m:'Empenho com saldo negativo.'});
  if(itens.some(i=>i.qtdAtual<0))al.push({t:'err',m:'Aditivo gerou quantidade atualizada negativa em item.'});
  if(itens.some(i=>i.saldoQtd<0))al.push({t:'err',m:'Item com quantidade faturada acima do contratado atualizado.'});
  if(totalContratado<0)al.push({t:'err',m:'Aditivos geraram valor atualizado negativo para o contrato.'});
  const semItem=lancBase.filter(l=>l.ativo&&!l.item).length;if(semItem)al.push({t:'warn',m:`${semItem} lançamento(s) sem item vinculado.`});
  const nfSemNumero=nfParaAlocar.filter(l=>!String(l.nf||'').trim()).length;if(nfSemNumero)al.push({t:'warn',m:`${nfSemNumero} NF(s) sem número informado.`});
  const nfSemData=nfParaAlocar.filter(l=>!l.dataNF).length;if(nfSemData)al.push({t:'warn',m:`${nfSemData} NF(s) sem data informada.`});
  const foraVig=lancBase.filter(l=>(l.dataOS&&!isIsoBetween(l.dataOS,c.vigInicio,vigFimAtual))||(l.hasNF&&l.dataNF&&!isIsoBetween(l.dataNF,c.vigInicio,vigFimAtual))).length;
  if(foraVig)al.push({t:'warn',m:`${foraVig} lançamento(s) com data de OS/NF fora da vigência vigente.`});
  const naoAloc=nfParaAlocar.filter(l=>l.valorCents>0&&((l.valorNaoAlocadoCents||0)>0||['pendente','negativo','parcial','sem_saldo'].includes(l.alocacaoStatus))).length;
  if(naoAloc)al.push({t:'err',m:`${naoAloc} NF(s) sem alocação válida em empenho. Valor afetado: ${fmtBRL(valorNaoAlocado)}.`});
  if(totalEmpenhado>0&&saldoEmpenho<saldoContratado&&saldoContratado>0)al.push({t:'warn',m:`Empenho disponível (${fmtBRL(saldoEmpenho)}) não cobre o saldo a faturar (${fmtBRL(saldoContratado)}).`});
  if(pct>=0.9&&pct<1)al.push({t:'warn',m:'Contrato acima de 90% faturado por NF.'});
  if(pct>=1&&totalContratado>0)al.push({t:'ok',m:'Contrato totalmente faturado por NF.'});
  if(totalOF>0&&totalNF===0)al.push({t:'ok',m:`Há OF registrada (${fmtBRL(totalOF)}), mas nenhuma NF faturada. Execução financeira em 0%.`});
  let status='ok';if(al.some(a=>a.t==='err'))status='err';else if(al.some(a=>a.t==='warn'))status='warn';
  return{itens,lanc:lancBase,aditivos,empenhos,totalOriginal,totalAcrescimos,totalSupressoes,totalContratado,saldoContratado,totalEmpenhado,saldoEmpenho,totalNF,totalOF,pendente,valorNaoAlocado,pct,al,status,dF,vigFimAtual};
}

/* ---------- render ---------- */
function render(){
  document.getElementById('tabBtnPainel').classList.toggle('active',tab==='painel');
  document.getElementById('tabBtnContrato').classList.toggle('active',tab==='contrato');
  document.getElementById('tabPainel').classList.toggle('active',tab==='painel');
  document.getElementById('tabContrato').classList.toggle('active',tab==='contrato');
  if(tab==='painel')renderPainel();else renderDetail();
}
function setTab(t){tab=t;if(t==='contrato'&&cur<0&&state.contratos.length)cur=0;render();}
function abrir(i){cur=i;tab='contrato';render();}
function setFiltro(k,v){filtros[k]=v;renderPainel();}
function limparFiltros(){filtros={fornecedor:'',gestor:'',situacao:'',vigencia:''};renderPainel();}
function setFiltroVigencia(v){
  filtros.vigencia=v;
  renderPainel();
  requestAnimationFrame(()=>document.getElementById('contratosVencimento')?.scrollIntoView({behavior:'smooth',block:'start'}));
}
function setVisaoPainel(v){visaoPainel=v;renderPainel();}
function vigClasse(dF){return dF===null?'sem':dF<0?'vencida':dF<=60?'vencendo':'vigente';}
function textoPrazoVigencia(dF){
  if(dF===null)return 'Prazo não informado';
  if(dF<0)return `Vencido há ${Math.abs(dF)} dia(s)`;
  if(dF===0)return 'Vence hoje';
  return `${dF} dia(s) restantes`;
}
function stat(k,v,cls){return `<div class="stat"><div class="k">${esc(k)}</div><div class="v ${cls||''}">${esc(v)}</div></div>`;}
function bignum(k,v,opt){
  opt=opt||{};
  const interativo=opt.onclick?` clickable${opt.selected?' selected':''}`:'';
  const acao=opt.onclick?` role="button" tabindex="0" onclick="${opt.onclick}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}"`:'';
  return `<div class="bignum ${opt.accent?'accent':''}${interativo}"${acao}><div class="k">${esc(k)}</div><div class="v ${opt.cls||''}">${esc(v)}</div>${opt.sub?`<div class="sub">${esc(opt.sub)}</div>`:''}</div>`;
}

function renderPainel(){
  const host=document.getElementById('tabPainel');
  if(!state.contratos.length){host.innerHTML='<section><div class="empty">Nenhum contrato cadastrado. Clique em “+ Novo contrato” ou “Carregar arquivo”.</div></section>';return;}
  const comps=state.contratos.map(compute);
  const totalizar=lista=>lista.reduce((a,c)=>({tc:a.tc+c.totalContratado,sc:a.sc+c.saldoContratado,te:a.te+c.totalEmpenhado,se:a.se+c.saldoEmpenho,pe:a.pe+c.pendente,na:a.na+c.valorNaoAlocado}),{tc:0,sc:0,te:0,se:0,pe:0,na:0});
  const tot=totalizar(comps);
  const sitOf=c=>String(c.situacao||c.statusContrato||'').trim();
  const passaVigencia=k=>!filtros.vigencia||
    (filtros.vigencia==='vencidos'&&k.dF!==null&&k.dF<0)||
    (filtros.vigencia==='ate30'&&k.dF!==null&&k.dF>=0&&k.dF<=30)||
    (filtros.vigencia==='31a60'&&k.dF!==null&&k.dF>30&&k.dF<=60);
  const passaDimensoes=c=>(!filtros.fornecedor||String(c.fornecedor||'').trim()===filtros.fornecedor)&&(!filtros.gestor||String(c.gestor||'').trim()===filtros.gestor)&&(!filtros.situacao||sitOf(c)===filtros.situacao);
  const passa=(c,k)=>passaDimensoes(c)&&passaVigencia(k);
  const compsFinanceiro=comps.filter((k,i)=>passa(state.contratos[i],k));
  const totFinanceiro=totalizar(compsFinanceiro);
  const pctCart=totFinanceiro.tc>0?(totFinanceiro.tc-totFinanceiro.sc)/totFinanceiro.tc:0;
  const nomesFaixa={vencidos:'Contratos vencidos',ate30:'Vencem em até 30 dias','31a60':'Vencem entre 31 e 60 dias'};
  const rotuloFinanceiro=filtros.vigencia?nomesFaixa[filtros.vigencia]:((filtros.fornecedor||filtros.gestor||filtros.situacao)?'Filtros selecionados':'Total geral');
  const compsDimensoes=comps.filter((k,i)=>passaDimensoes(state.contratos[i]));
  const faixaVencidos=compsDimensoes.filter(c=>c.dF!==null&&c.dF<0);
  const faixa30=compsDimensoes.filter(c=>c.dF!==null&&c.dF>=0&&c.dF<=30);
  const faixa60=compsDimensoes.filter(c=>c.dF!==null&&c.dF>30&&c.dF<=60);
  const valorFaixa=lista=>lista.reduce((s,c)=>s+c.totalContratado,0);
  const vencendo=faixa30.length+faixa60.length;
  const vencidos=faixaVencidos.length;
  const alocPend=comps.filter(c=>c.valorNaoAlocado>0).length;
  let h='<section><h2>Agenda de vencimentos</h2><div class="bignums">';
  h+=bignum('Contratos vencidos',String(vencidos),{cls:vencidos?'neg':'pos',sub:`Valor associado: ${fmtBRL(valorFaixa(faixaVencidos))}`,onclick:"setFiltroVigencia('vencidos')",selected:filtros.vigencia==='vencidos'});
  h+=bignum('Vencem em até 30 dias',String(faixa30.length),{cls:faixa30.length?'neg':'pos',sub:`Valor associado: ${fmtBRL(valorFaixa(faixa30))}`,onclick:"setFiltroVigencia('ate30')",selected:filtros.vigencia==='ate30'});
  h+=bignum('Vencem entre 31 e 60 dias',String(faixa60.length),{sub:`Valor associado: ${fmtBRL(valorFaixa(faixa60))}`,onclick:"setFiltroVigencia('31a60')",selected:filtros.vigencia==='31a60'});
  h+=bignum('Total geral',String(compsDimensoes.length),{accent:true,sub:`Valor contratado: ${fmtBRL(totalizar(compsDimensoes).tc)}`,onclick:"setFiltroVigencia('')",selected:!filtros.vigencia});
  h+='</div></section>';
  h+='<section><div class="selectbar"><h2 style="margin:0">Sumário financeiro</h2><span class="badge b-ok">'+esc(rotuloFinanceiro)+' · '+compsFinanceiro.length+' contrato(s)</span></div><div class="bignums">';
  h+=bignum('Total contratado',fmtBRL(totFinanceiro.tc),{accent:true});
  h+=bignum('Saldo a faturar',fmtBRL(totFinanceiro.sc));
  h+=bignum('Percentual faturado',fmtPct(pctCart));
  h+=bignum('Total empenhado',fmtBRL(totFinanceiro.te));
  h+=bignum('Saldo de empenho',fmtBRL(totFinanceiro.se),{cls:totFinanceiro.se<0?'neg':'pos'});
  h+=bignum('Pendente pagamento NF',fmtBRL(totFinanceiro.pe));
  h+=bignum('Valor não alocado',fmtBRL(totFinanceiro.na),{cls:totFinanceiro.na>0?'neg':'pos'});
  h+='</div>';
  const alerts=[];
  if(alocPend)alerts.push({t:'err',m:`${alocPend} contrato(s) com NF sem alocação válida em empenho.`});
  if(!alerts.length)alerts.push({t:'ok',m:'Nenhum alerta crítico de prazo ou de alocação no momento.'});
  h+='<div class="alerts">'+alerts.map(a=>`<div class="alert ${a.t}">${esc(a.m)}</div>`).join('')+'</div></section>';
  // ---- filtros ----
  const forns=[...new Set(state.contratos.map(c=>String(c.fornecedor||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const gestores=[...new Set(state.contratos.map(c=>String(c.gestor||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const sits=[...new Set(state.contratos.map(sitOf).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const idx=state.contratos.map((c,i)=>i).filter(i=>passa(state.contratos[i],comps[i])).sort((a,b)=>{
    const va=comps[a].vigFimAtual||'9999-12-31',vb=comps[b].vigFimAtual||'9999-12-31';
    return va.localeCompare(vb)||String(state.contratos[a].contrato||'').localeCompare(String(state.contratos[b].contrato||''),'pt-BR',{numeric:true});
  });
  const ativo=!!(filtros.fornecedor||filtros.gestor||filtros.situacao||filtros.vigencia);
  const opt=(v,sel,lbl)=>`<option value="${esc(v)}" ${sel===v?'selected':''}>${esc(lbl)}</option>`;
  let fb='<div class="filterbar no-print">';
  fb+='<div><label>Fornecedor</label><select onchange="setFiltro(\'fornecedor\',this.value)"><option value="">Todos os fornecedores</option>'+forns.map(f=>opt(f,filtros.fornecedor,f)).join('')+'</select></div>';
  fb+='<div><label>Responsável</label><select onchange="setFiltro(\'gestor\',this.value)"><option value="">Todos os responsáveis</option>'+gestores.map(g=>opt(g,filtros.gestor,g)).join('')+'</select></div>';
  fb+='<div style="min-width:0"><label>Situação</label><div class="filterbuttons">'+
    `<button class="btn ${!filtros.situacao?'primary':''}" onclick="setFiltro('situacao','')">Todos</button>`+
    sits.map(s=>`<button class="btn ${filtros.situacao===s?'primary':''}" onclick="setFiltro('situacao',decodeURIComponent('${encodeURIComponent(s)}'))">${esc(s)}</button>`).join('')+
    '</div></div>';
  fb+='<div style="min-width:0"><button class="btn" onclick="limparFiltros()">Limpar filtros</button></div></div>';
  let sub='';
  if(ativo){
    const ft=idx.reduce((a,i)=>{const k=comps[i];return{tc:a.tc+k.totalContratado,sc:a.sc+k.saldoContratado,te:a.te+k.totalEmpenhado,se:a.se+k.saldoEmpenho,pe:a.pe+k.pendente};},{tc:0,sc:0,te:0,se:0,pe:0});
    sub=`<div class="alert ok" style="margin:0 0 12px">Mostrando <strong>${idx.length}</strong> de ${state.contratos.length} contratos · Total contratado <strong>${fmtBRL(ft.tc)}</strong> · Saldo a faturar ${fmtBRL(ft.sc)} · Empenhado ${fmtBRL(ft.te)} · Saldo empenho ${fmtBRL(ft.se)} · Pendente NF ${fmtBRL(ft.pe)}</div>`;
  }
  const seletorVisao='<div class="view-switch no-print"><span class="small">Visualização</span>'+
    `<button class="btn ${visaoPainel==='executiva'?'primary':''}" onclick="setVisaoPainel('executiva')">Executiva</button>`+

    :'<th>Vigência</th><th>Contrato</th><th>Fornecedor</th><th>Gestor</th><th>Situação</th><th class="num">Total contratado</th><th class="num">Saldo a faturar</th><th class="num">% faturado</th><th class="num">Empenhado</th><th class="num">Saldo empenho</th><th>Status</th>';
  h+='</tr></thead><tbody>';

        `<td><div class="exec-fornecedor">${esc(c.fornecedor||'—')}</div><div class="exec-meta">Contrato ${esc(c.contrato||'(sem nº)')} · Processo ${esc(c.processo||'—')}</div></td>`+

        `<td class="num"><strong>${fmtBRL(k.totalContratado)}</strong><div class="exec-meta">Saldo: ${fmtBRL(k.saldoContratado)}</div></td>`+
        `<td>${stt}<div class="exec-meta">${esc(sitOf(c)||'—')}</div></td></tr>`;
    }else{
      h+=`<tr onclick="abrir(${i})"><td><span class="vig-main ${classeVig}">${esc(vig)}</span><span class="vig-sub">${esc(textoPrazoVigencia(k.dF))}</span></td>`+

        `<td>${esc(c.fornecedor||'—')}</td><td>${esc(c.gestor||'—')}</td><td>${esc(sitOf(c)||'—')}</td>`+
        `<td class="num">${fmtBRL(k.totalContratado)}</td><td class="num">${fmtBRL(k.saldoContratado)}</td>`+
        `<td class="num">${fmtPct(k.pct)}</td><td class="num">${fmtBRL(k.totalEmpenhado)}</td>`+
        `<td class="num saldo ${k.saldoEmpenho<0?'neg':k.saldoEmpenho===0?'zero':'pos'}">${fmtBRL(k.saldoEmpenho)}</td><td>${stt}</td></tr>`;
    }
  });
  if(!idx.length)h+=`<tr><td colspan="${visaoPainel==='executiva'?5:11}"><div class="empty">Nenhum contrato corresponde aos filtros selecionados.</div></td></tr>`;
  h+='</tbody></table></div></section>';
  host.innerHTML=h;
}

function sugestoesCampo(f){
  return [...new Set(state.contratos.map(c=>normalizeSpaces(c[f])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
function field(lbl,sec,f,val,ph,sugestoes){
  const lista=Array.isArray(sugestoes)?sugestoes:[];
  const listId=lista.length?`sug-${f}`:'';
  return `<div><label>${esc(lbl)}</label><input data-sec="${sec}" data-f="${f}" value="${esc(val)}" placeholder="${esc(ph||'')}" ${listId?`list="${listId}"`:''}>${listId?`<datalist id="${listId}">${lista.map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist>`:''}</div>`;
}
function fieldDate(lbl,sec,f,val){return `<div><label>${esc(lbl)}</label><input type="date" data-sec="${sec}" data-f="${f}" value="${esc(val)}"></div>`;}
function allocRowHtml(li,ai,a,empOpts){
  return `<div class="allocrow"><select data-sec="aloc" data-li="${li}" data-ai="${ai}" data-f="empenho"><option value="">—</option>${empOpts.map(o=>`<option ${a.empenho===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`+
    `<input class="num" data-sec="aloc" data-li="${li}" data-ai="${ai}" data-f="qtd" value="${esc(fmtQtyInput(a.qtd))}" placeholder="qtd un (vazio = restante)" style="width:120px">`+
    `<span class="small mono" id="alocv-${li}-${ai}"></span>`+
    `<button class="del no-print" onclick="delAloc(${li},${ai})">✕</button></div>`;
}

function refreshDetailComputed(){
  if(cur<0||!state.contratos[cur])return;
  const c=state.contratos[cur],k=compute(c);
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  const setS=(id,cents)=>{const e=document.getElementById(id);if(e){e.textContent=fmtBRL(cents);e.className='num mono saldo '+(cents<0?'neg':cents===0?'zero':'pos');}};
  k.itens.forEach((it,i)=>{set('itadit-'+i,(it.qtdAditivo>0?'+':'')+fmtQty(it.qtdAditivo));set('itatual-'+i,fmtQty(it.qtdAtual));set('ittot-'+i,fmtBRL(it.totalCents));
    const q=document.getElementById('itq-'+i);if(q){q.textContent=fmtQty(it.saldoQtd);q.className='num mono saldo '+(it.saldoQtd<0?'neg':it.saldoQtd===0?'zero':'pos');}
    setS('itv-'+i,it.saldoCents);});
  k.aditivos.forEach((a,i)=>{set('adval-'+i,fmtBRL(a.valorLiquidoCents));
    const se=document.getElementById('adsaldo-'+i);
    if(se){if(String((state.contratos[cur].aditivos[i]||{}).empenhoNum||'').trim()&&a.empSaldo!==undefined){se.textContent=fmtBRL(a.empSaldo);se.className='num mono saldo '+(a.empSaldo<0?'neg':a.empSaldo===0?'zero':'pos');}else{se.textContent='—';se.className='num mono saldo';}}});
  const unitOfDetail=item=>{const it=c.itens.find(x=>String(x.item)===String(item));return it?parseMoneyToCents(it.unit):0;};
  const unitItem1=(c.itens[0]?parseMoneyToCents(c.itens[0].unit):0);
  k.empenhos.forEach((e,i)=>{if(e.origem==='contrato'){set('empu-'+e.ref,fmtBRL(e.usado));setS('emps-'+e.ref,e.saldo);
    set('empun-'+e.ref, unitItem1>0?(e.saldo>=0?fmtQty(Math.floor(e.saldo/unitItem1))+' un':'—'):'—');}});
  const manual=c.autoAlocacao===false;
  k.lanc.forEach((l,i)=>{
    set('lv-'+i,fmtBRL(l.valorCents));
    if(!manual){
      const a=document.getElementById('la-'+i);
      if(a){
        if(!l.hasNF)a.innerHTML='<span class="small">Aguardando NF</span>';
        else if(l.alocacaoStatus==='ok'){const d=(l.alocacoes||[]).map(x=>`${esc(x.empenho)}: ${fmtBRL(x.valorCents)}`).join('<br>');a.innerHTML=`<span class="alloc-ok">${esc(l.alocacaoEmpenho)}</span><br><span class="small">${d}</span>`;}
        else if(l.alocacaoStatus==='ignorado')a.innerHTML='<span class="small">—</span>';
        else if(l.alocacaoStatus==='parcial')a.innerHTML=`<span class="alloc-warn">Parcialmente alocada</span><br><span class="small">${fmtBRL(l.valorNaoAlocadoCents)} sem saldo</span>`;
        else a.innerHTML=`<span class="alloc-err">Sem saldo suficiente</span><br><span class="small">${fmtBRL(l.valorNaoAlocadoCents||l.valorCents)} sem saldo</span>`;
      }
    }else{
      (l.alocCalc||[]).forEach((x,ai)=>{const el=document.getElementById(`alocv-${i}-${ai}`);if(el)el.textContent=x.hasEmp?('= '+fmtBRL(x.v)+(x.q?` (${fmtQty(x.q)} un)`:'')):'';});
      const st=document.getElementById('lastatus-'+i);
      if(st){
        if(!l.hasNF)st.innerHTML='<span class="small">Aguardando NF</span>';
        else{const cls=l.alocacaoStatus==='ok'?'alloc-ok':(['negativo','sem_saldo'].includes(l.alocacaoStatus)?'alloc-err':'alloc-warn');st.innerHTML=`<span class="${cls}">${esc(l.alocacaoMsg||'')}</span> <span class="small">— alocado ${fmtQty(l.qtdAlocada||0)}/${fmtQty(l.qtdNum||0)} un · ${fmtBRL(l.valorAlocadoCents||0)}</span>`;}
      }
    }
  });
  set('sumOriginal',fmtBRL(k.totalOriginal));set('sumAcr',fmtBRL(k.totalAcrescimos));set('sumSup',fmtBRL(k.totalSupressoes));
  set('sumTotal',fmtBRL(k.totalContratado));set('sumVig',fmtDate(k.vigFimAtual));
  const sc=document.getElementById('sumSaldoCont');if(sc){sc.textContent=fmtBRL(k.saldoContratado);sc.className='v '+(k.saldoContratado<0?'neg':'');}
  set('sumPct',fmtPct(k.pct));set('sumEmpenhado',fmtBRL(k.totalEmpenhado));
  const se=document.getElementById('sumSaldoEmp');if(se){se.textContent=fmtBRL(k.saldoEmpenho);se.className='v '+(k.saldoEmpenho<0?'neg':'pos');}
  set('sumPend',fmtBRL(k.pendente));set('sumOF',fmtBRL(k.totalOF));
  const na=document.getElementById('sumNaoAlocado');if(na){na.textContent=fmtBRL(k.valorNaoAlocado);na.className='v '+(k.valorNaoAlocado>0?'neg':'pos');}
  const as=document.getElementById('alertStrip');
  if(as)as.innerHTML=k.al.length?k.al.map(a=>`<div class="alert ${a.t}">${esc(a.m)}</div>`).join(''):'<div class="alert ok">Sem alertas para este contrato.</div>';
  renderPdfStatus();
}

/* ---------- edits ---------- */
function handleEdit(e){
  const t=e.target,sec=t.dataset.sec;if(!sec||cur<0)return;
  const c=state.contratos[cur],f=t.dataset.f;
  const val=t.type==='checkbox'?t.checked:t.value;
  if(sec==='aloc'){const li=+t.dataset.li,ai=+t.dataset.ai,l=c.lancamentos[li];if(!Array.isArray(l.alocManual))l.alocManual=[];if(l.alocManual[ai])l.alocManual[ai][f]=val;}
  else if(sec==='gerais')c[f]=val;
  else c[{emp:'empenhos',item:'itens',adit:'aditivos',lanc:'lancamentos'}[sec]][+t.dataset.i][f]=val;
  persistirLocal();
  if(sec==='gerais'&&f==='autoAlocacao')renderDetail();else refreshDetailComputed();
}
document.addEventListener('input',handleEdit);
document.addEventListener('change',handleEdit);
document.addEventListener('blur',e=>{const t=e.target;if(t&&t.matches&&t.matches('input.num')&&t.dataset&&['qtd','qtdAcrescimo','qtdSupressao'].includes(t.dataset.f)){t.value=fmtQtyInput(t.value);handleEdit({target:t});}},true);
function addRow(sec){const c=state.contratos[cur];
  if(sec==='empenhos')c.empenhos.push({num:'',valor:''});
  else if(sec==='itens')c.itens.push({item:'',desc:'',qtd:'',unit:''});
  else if(sec==='aditivos')c.aditivos.push({numero:'',ano:String(new Date().getFullYear()),tipo:'',processo:c.processo||'',data:'',item:'',qtdAcrescimo:'',qtdSupressao:'',valorAcrescimo:'',valorSupressao:'',novaVigFim:'',observacao:'',empenhoNum:'',empenhoValor:''});
  else c.lancamentos.push({of:'',anoOF:String(new Date().getFullYear()),item:'',qtd:'',valorNF:'',dataOS:'',nf:'',dataNF:'',empenho:'',pago:false,alocManual:[]});
  persistirLocal();renderDetail();}
function delRow(sec,i){state.contratos[cur][sec].splice(i,1);persistirLocal();renderDetail();}
function addAloc(li){const l=state.contratos[cur].lancamentos[li];if(!Array.isArray(l.alocManual))l.alocManual=[];l.alocManual.push({empenho:'',qtd:''});persistirLocal();renderDetail();}
function delAloc(li,ai){state.contratos[cur].lancamentos[li].alocManual.splice(ai,1);persistirLocal();renderDetail();}
function novoContrato(){state.contratos.push(novoContratoObj());cur=state.contratos.length-1;tab='contrato';persistirLocal();render();}
function excluirContrato(){if(!confirm('Excluir este contrato? Esta ação não pode ser desfeita.'))return;state.contratos.splice(cur,1);cur=state.contratos.length?0:-1;tab=state.contratos.length?'contrato':'painel';persistirLocal();render();}

/* ---------- PDF / anexos ---------- */
async function readPdfText(file){
  if(typeof pdfjsLib==='undefined')throw new Error('Biblioteca PDF.js indisponível (sem internet).');
  if(pdfjsLib.GlobalWorkerOptions)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buffer=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buffer}).promise;
  let text='';for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p);const content=await page.getTextContent();text+='\n'+content.items.map(i=>i.str).join(' ');}
  return normalizeSpaces(text);
}
function extractContratoData(text){
  const t=normalizeSpaces(text);const out={};
  const proc=t.match(/\b(20\d{13})\b/);if(proc)out.processo=proc[1];
  const contrato=t.match(/(?:CONTRATO(?:\s+ADMINISTRATIVO)?|Contrato(?:\s+Administrativo)?)\s*(?:n[ºo°]?\.?\s*)?([0-9]{1,4}\s*\/\s*[0-9]{4})/i);
  if(contrato)out.contrato=contrato[1].replace(/\s/g,'');
  const cnpj=t.match(/\b\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}\b/);if(cnpj)out.cnpj=cnpj[0];
  let forn=t.match(/(?:CONTRATADA|Contratada)\s*[:\-]?\s*([A-ZÁÀÂÃÉÈÊÍÓÔÕÚÇ0-9][A-ZÁÀÂÃÉÈÊÍÓÔÕÚÇ0-9 &.,'’\-]{4,120}?)(?=\s*(?:,?\s*(?:inscrita|CNPJ|CPF|com sede|doravante|representada)|\.))/i);
  if(!forn)forn=t.match(/(?:e\s+a\s+empresa)\s+([A-ZÁÀÂÃÉÈÊÍÓÔÕÚÇ0-9][A-ZÁÀÂÃÉÈÊÍÓÔÕÚÇ0-9 &.,'’\-]{4,120}?)(?=\s*(?:,?\s*(?:inscrita|CNPJ|CPF|com sede)|\.))/i);
  if(forn)out.fornecedor=normalizeSpaces(forn[1]).replace(/[,.;:]+$/,'');
  const vig=t.match(/vig[êe]ncia[^\.]{0,120}?(\d{2}[\/\-.]\d{2}[\/\-.]\d{4})[^\.]{0,80}?(?:a|até|ate)\s*(\d{2}[\/\-.]\d{2}[\/\-.]\d{4})/i);
  if(vig){out.vigInicio=brDateToIso(vig[1]);out.vigFim=brDateToIso(vig[2]);}
  return out;
}
function applyExtractedData(data){const c=state.contratos[cur];const filled=[];['processo','contrato','fornecedor','cnpj','vigInicio','vigFim'].forEach(k=>{if(data[k]&&!c[k]){c[k]=data[k];filled.push(k);}});return filled;}
async function addAnexos(){
  const inp=document.getElementById('anexoInput');if(!inp||!inp.files||!inp.files.length)return;
  const c=state.contratos[cur];if(!c)return;if(!c.anexos)c.anexos=[];c.pdfStatus='Processando anexo(s)...';renderPdfStatus();
  const messages=[];
  for(const f of [...inp.files]){
    c.anexos.push({nome:f.name,url:URL.createObjectURL(f)});
    if(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf')){
      try{const text=await readPdfText(f);c.docText=text.slice(0,120000);
        if(!text||text.length<80){messages.push(`PDF "${f.name}" anexado, mas sem texto suficiente (provável escaneado/imagem).`);continue;}
        const filled=applyExtractedData(extractContratoData(text));
        messages.push(filled.length?`PDF "${f.name}" lido. Campos preenchidos: ${filled.join(', ')}.`:`PDF "${f.name}" lido, mas nenhum campo novo identificado com segurança.`);
      }catch(err){messages.push(`PDF "${f.name}" anexado. Leitura automática falhou: ${err.message||err}.`);}
    }else{messages.push(`Arquivo "${f.name}" anexado. Preenchimento automático só para PDF textual.`);}
  }
  c.pdfStatus=messages.join(' ');inp.value='';persistirLocal();renderDetail();
}
function renderPdfStatus(){const box=document.getElementById('pdfStatusBox');if(!box||cur<0)return;const c=state.contratos[cur];box.innerHTML=c.pdfStatus?`<div class="alert ${/falhou|sem texto|nenhum campo/i.test(c.pdfStatus)?'warn':'ok'}">${esc(c.pdfStatus)}</div>`:'';}
function renderAnexos(){const box=document.getElementById('anexosBox');if(!box)return;const c=state.contratos[cur];
  if(!c.anexos||!c.anexos.length){box.innerHTML='<span class="hint">Nenhum documento anexado.</span>';return;}
  box.innerHTML=c.anexos.map((a,i)=>`<span class="chip">📎 ${a.url?`<a href="${a.url}" target="_blank">${esc(a.nome)}</a>`:esc(a.nome)} <button onclick="delAnexo(${i})" title="Remover">✕</button></span>`).join('');}
function delAnexo(i){state.contratos[cur].anexos.splice(i,1);persistirLocal();renderAnexos();}

/* ---------- save/load ---------- */
function salvar(){const clean=JSON.parse(JSON.stringify(state));clean.contratos.forEach(c=>{if(c.anexos)c.anexos=c.anexos.map(a=>({nome:a.nome,url:/^https?:/.test(a.url||'')?a.url:undefined}));});
  const blob=new Blob([JSON.stringify(clean,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='controle_contratos_NEP.json';a.click();}
function carregar(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.contratos))throw 0;state=d;normalizeState();cur=state.contratos.length?0:-1;tab='painel';persistirLocal();render();}
  catch(e){alert('Arquivo inválido. Selecione um controle salvo por esta ferramenta.');}ev.target.value='';};
  r.readAsText(f);}

/* ---------- boot ---------- */
normalizeState();
carregarLocal();
if(cur<0&&state.contratos.length)cur=0;
render();
</script>
